seed: 20260831
primary_metric: patient_equal_MAE
min_cells_per_visit: 100
bootstrap_primary: 5000
bootstrap_quick_check: 300
mixing_weight_grid_step: 0.01

# -----------------------------------------------------------------------------
# One primary statistical decision
# -----------------------------------------------------------------------------
primary_decision:
  rule: principled_iut
  movement:
    descriptive_effect_size: PDR_Hellinger_ratio
    inferential_statistic: Hellinger_margin_contrast
    margin: 0.01
    denominator_diagnostic: required
  utility:
    metric: PUC_reference_minus_candidate
    lcb_margin: 0.0
  retention:
    metric: NPI_reference_minus_retained
    lcb_margin: 0.0
  component_alpha: 0.05
  retention_stability_is_core_gate: false
  note: "Movement, Utility and Retention are all necessary; orthogonal profiles do not become extra qualification gates."


# -----------------------------------------------------------------------------
# Inference modes. Honest confirmation is the finite-sample reference mode;
# efficient LOPO maximizes patient use but requires stability/calibration.
# -----------------------------------------------------------------------------
inference_modes:
  honest_confirmation:
    development_confirmation_independent: true
    movement_test: localized_hoeffding_margin_contrast
    utility_test: localized_hoeffding_prediction_difference
    retention_test: localized_hoeffding_prediction_difference
    exact_finite_sample_claim: true
    conditional_on_frozen_contract: true
  efficient_lopo:
    development_confirmation_independent: false
    movement_test: margin_contrast_with_ratio_reported_descriptively
    historical_interval_for_locked_results: patient_percentile_bootstrap
    full_pipeline_resampling_sensitivity: true
    stability_diagnostic: true
    exact_finite_sample_claim: false
    asymptotic_claim_requires_algorithmic_stability: true

frozen_analysis_contract:
  required_fields:
    - candidate
    - reference_rule
    - ontology
    - loss
    - movement_margin
    - lambda_grid
    - inference_rule
  post_target_change_creates_new_development_analysis: true

# -----------------------------------------------------------------------------
# Recommended structured candidate. GraphFlow is exactly nested at rho=0.
# -----------------------------------------------------------------------------
structured_candidate:
  canonical_baseline: GraphFlow
  nonlinear_extension: GraphResidualTransformer
  selection_policy: "candidate class must be frozen before held-out scoring; do not switch after seeing outcomes"
  graphflow_alpha: 1.0
  patient_balanced: true
  transformer:
    layers: 1
    d_model: 8
    heads: 2
    feedforward: 16
    dropout: 0.0
    epochs: 8
    learning_rate: 0.002
    weight_decay: 0.001
    residual_fraction: 0.20
    anchor_strength: 0.15
  constraints:
    frozen_graph: true
    graphflow_zero_residual_anchor: true
    target_columns_for_prediction: false
    heldout_target_tuning: false
  note: "Transformer capacity changes candidate generation only; it never changes the IUT."

# Exact historical reproduction; not the primary formulation.
legacy_six_gate_rule:
  enabled: true
  pdr_point_min: 0.05
  pdr_lcb_min: 0.01
  puc_lcb_min: 0.0
  positive_weight_fold_fraction_min: 0.70
  npi_lcb_min: 0.0
  require_final_risk_below_reference: true

# Reported separately from qualification.
orthogonal_profiles:
  - retention_stability
  - perturbation_stability
  - reference_robustness
  - ontology_robustness
  - transportability
  - tail_subgroup_safety
  - structural_resolution

# Design mode is entered only after the frozen evidence state is recorded.
design_mode:
  partial_graph_identification:
    enabled: true
    simultaneous_family: pairwise_max_abs_t
    causal_claim: false
  safe_graph_averaging:
    enabled: true
    frozen_fallback: true
    mean_nonharm_margin: 0.0
    one_standard_error_preference: true
  sequence: "partial identification -> safe graph averaging -> re-lock -> re-qualify"

# Available research diagnostics. They are not enabled as primary gates.
advanced_diagnostics:
  bayesian_bootstrap: available
  conventional_test_benchmarks: available
  proper_log_score_sensitivity: available
  tail_safe_retention: experimental
  robust_graph_averaging: experimental
  continuous_edge_shrinkage: experimental

calibration_policy:
  movement_margin_is_sample_size_adaptive: false
  null_thresholds_are_diagnostic_only: true
  real_data_used_to_tune_transformer_defaults: false
